name: Windows build and release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar release v2.0.1 após os testes
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ['v2.0.1']
  pull_request:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Test local server and live controls
        run: npm test
      - name: Test Rust state validation
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build Windows installer
        run: npm run dist
      - name: Smoke test native executable and persistence
        run: node scripts/smoke-native.cjs
      - name: Prepare release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe
          if ($installer.Count -ne 1) { throw 'Expected one NSIS installer' }
          Copy-Item -LiteralPath $installer.FullName release-assets/DBD-Tournament-Overlay-Setup-2.0.1.exe
          Copy-Item -LiteralPath src-tauri/target/release/dbd-tournament-overlay.exe release-assets/DBD-Tournament-Overlay-Portable-2.0.1.exe
          Get-ChildItem release-assets/*.exe | ForEach-Object {
            $digest = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$digest  $($_.Name)"
          } | Set-Content release-assets/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: DBD-Tournament-Windows-2.0.1
          path: release-assets/*
          if-no-files-found: error
      - name: Publish verified release
        if: (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && github.ref == 'refs/tags/v2.0.1')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.1
          target_commitish: ${{ github.sha }}
          name: DBD Tournament Overlay v2.0.1
          body_path: RELEASE_NOTES.md
          make_latest: true
          fail_on_unmatched_files: true
          files: release-assets/*
