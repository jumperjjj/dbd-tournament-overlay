<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>DBD Tournament Overlay</title><link rel="stylesheet" href="overlay.css"></head><body class="style-1">
<div id="wrap"><div class="board"><div class="teamBlock teamA"><div class="teamCard"><div class="identity"><div class="role" id="roleA"></div><div class="teamName" id="nameA"></div></div><div class="stats" id="statsA"></div></div><div class="wins" id="winsA"></div></div><div class="center"><div class="scoreline"><b id="scoreA"></b><span>:</span><b id="scoreB"></b></div></div><div class="teamBlock teamB"><div class="teamCard"><div class="identity"><div class="teamName" id="nameB"></div><div class="role" id="roleB"></div></div><div class="stats" id="statsB"></div></div><div class="wins" id="winsB"></div></div></div><div class="lower"><div id="championship"></div><div id="set"></div></div></div>
<script>
const $=s=>document.querySelector(s);
// Transparent in OBS. A separate browser test page may request a neutral background.
if(new URLSearchParams(location.search).has('preview'))document.documentElement.style.background='#182124';
function victoryMarks(wins,bestOf){const target=bestOf===3?2:3;const count=Math.max(0,Math.min(target,Math.round(Number(wins)||0)));return Array.from({length:target},(_,i)=>'<i class="win'+(i<count?' filled':'')+'" aria-hidden="true"></i>').join('');}
function stats(data){return [['gen','generator'],['hook','hook'],['first','hook']].map(([key,img])=>'<span class="stat">'+(key==='first'?'<small>1<span class="ordinal">st</span></small>':'')+'<img alt="'+({gen:'Geradores',hook:'Ganchos',first:'Primeiros ganchos'}[key])+'" src="assets/'+img+'.png"><b>'+Math.max(0,Math.min({gen:5,hook:12,first:4}[key],Math.round(Number(data?.[key])||0)))+'</b></span>').join('');}
function draw(s){
 const style=Math.max(1,Math.min(8,Math.round(Number(s.overlayStyle)||1)));
 document.body.className='style-'+style+(style>4?' marked':' numeric')+(s.teamHighlights===false?' uniform':'')+(s.overlayGradient===false?' no-gradient':'');
 const root=document.documentElement;root.style.setProperty('--number','#ffffff');root.style.setProperty('--gradient',s.overlayGradient===false?'0':'1');
 for(const [variable,key,fallback] of [['--a','teamAColor','#8ba99f'],['--b','teamBColor','#94a1b8'],['--accent','accentColor','#d4dedf']])root.style.setProperty(variable,/^#[0-9a-f]{6}$/i.test(s[key])?s[key]:fallback);
 if(s.teamHighlights===false){const shared=/^#[0-9a-f]{6}$/i.test(s.accentColor)?s.accentColor:'#d4dedf';root.style.setProperty('--a',shared);root.style.setProperty('--b',shared);}
 root.style.setProperty('--top',Math.max(6,Math.min(100,Number(s.hudTop??78)))+'px');
 root.style.setProperty('--scale',Math.max(.9,Math.min(1.1,(Number(s.hudScale)||100)/100)));
 const background=/^#[0-9a-f]{6}$/i.test(s.bgColor)?s.bgColor:'#151d23';root.style.setProperty('--bg-rgb',[1,3,5].map(i=>parseInt(background.slice(i,i+2),16)).join(' '));root.style.setProperty('--opacity',Math.max(0,Math.min(100,Number(s.bgOpacity??85)))/100);
 const lower=$('.lower');const host=style>4?$('.center'):$('#wrap');if(lower.parentElement!==host)host.appendChild(lower);
 $('#nameA').textContent=s.teamA||'TIME A';$('#nameB').textContent=s.teamB||'TIME B';
 $('#scoreA').textContent=s.scoreA;$('#scoreB').textContent=s.scoreB;
 $('#statsA').innerHTML=stats(s.a);$('#statsB').innerHTML=stats(s.b);
 $('#championship').textContent=s.championship||'DBD CHAMPIONSHIP';$('#set').textContent='SET '+s.currentSet;
 for(const side of ['A','B']){
  const killer=s.killerSide===side;$('#role'+side).innerHTML='<img alt="'+(killer?'Killer':'Survivors')+'" src="assets/'+(killer?'killer':'survivor')+'.png">';
  const wins=$('#wins'+side);wins.innerHTML=victoryMarks(s['score'+side],s.bestOf);wins.setAttribute('aria-label','Time '+side+': '+s['score'+side]+' de '+(s.bestOf===3?2:3)+' vitórias');
 }
}
const events=new EventSource('/events');events.onmessage=e=>draw(JSON.parse(e.data));
</script></body></html>
