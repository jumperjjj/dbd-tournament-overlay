<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DBD Tournament Control</title><link rel="stylesheet" href="panel.css"></head><body><main>
<header><h1>DBD Tournament Control</h1><span id="connectionDot" class="connection" title="Conectando" aria-label="Conectando"></span></header>
<div id="connectionStatus" class="status" role="status" aria-live="polite" hidden></div>
<label class="champ-label" for="championship">CAMPEONATO</label><input id="championship" aria-label="Nome do campeonato" maxlength="60" oninput="edit({championship:this.value})">
<div class="teams"><section class="team team-a" aria-label="Time A"><div class="team-head"><label for="teamA">TIME A</label><img id="panelRoleA" src="assets/killer.png" alt="Killer"></div><input class="team-name" id="teamA" aria-label="Nome do time A" maxlength="48" oninput="edit({teamA:this.value})"><div class="score"><button type="button" aria-label="Diminuir placar do time A" onclick="scoreStep('A',-1)">−</button><input id="scoreA" type="number" min="0" max="3" aria-label="Placar do time A" oninput="scoreValue('A',this.value)"><button type="button" class="plus" aria-label="Aumentar placar do time A" onclick="scoreStep('A',1)">+</button></div><div class="panel-wins" id="winsA" aria-hidden="true"></div><div class="counters"><div class="counter"><button type="button" class="step plus" aria-label="Aumentar Gerador do time A" onclick="step('a','gen',1)">+</button><div class="counter-readout"><label class="stat-icon" title="Gerador"><img src="assets/generator.png" alt="Gerador"></label><input id="agen" type="number" min="0" max="5" aria-label="Gerador do time A" oninput="counterValue('a','gen',this.value)"></div><button type="button" class="step minus" aria-label="Diminuir Gerador do time A" onclick="step('a','gen',-1)">−</button></div><div class="counter"><button type="button" class="step plus" aria-label="Aumentar Gancho do time A" onclick="step('a','hook',1)">+</button><div class="counter-readout"><label class="stat-icon" title="Gancho"><img src="assets/hook.png" alt="Gancho"></label><input id="ahook" type="number" min="0" max="12" aria-label="Gancho do time A" oninput="counterValue('a','hook',this.value)"></div><button type="button" class="step minus" aria-label="Diminuir Gancho do time A" onclick="step('a','hook',-1)">−</button></div><div class="counter"><button type="button" class="step plus" aria-label="Aumentar Primeiro gancho do time A" onclick="step('a','first',1)">+</button><div class="counter-readout"><label class="stat-icon" title="Primeiro gancho"><img src="assets/hook.png" alt="Primeiro gancho"><small>1<span class="ordinal">st</span></small></label><input id="afirst" type="number" min="0" max="4" aria-label="Primeiro gancho do time A" oninput="counterValue('a','first',this.value)"></div><button type="button" class="step minus" aria-label="Diminuir Primeiro gancho do time A" onclick="step('a','first',-1)">−</button></div></div></section><section class="team team-b" aria-label="Time B"><div class="team-head"><label for="teamB">TIME B</label><img id="panelRoleB" src="assets/survivor.png" alt="Survivors"></div><input class="team-name" id="teamB" aria-label="Nome do time B" maxlength="48" oninput="edit({teamB:this.value})"><div class="score"><button type="button" aria-label="Diminuir placar do time B" onclick="scoreStep('B',-1)">−</button><input id="scoreB" type="number" min="0" max="3" aria-label="Placar do time B" oninput="scoreValue('B',this.value)"><button type="button" class="plus" aria-label="Aumentar placar do time B" onclick="scoreStep('B',1)">+</button></div><div class="panel-wins" id="winsB" aria-hidden="true"></div><div class="counters"><div class="counter"><button type="button" class="step plus" aria-label="Aumentar Gerador do time B" onclick="step('b','gen',1)">+</button><div class="counter-readout"><label class="stat-icon" title="Gerador"><img src="assets/generator.png" alt="Gerador"></label><input id="bgen" type="number" min="0" max="5" aria-label="Gerador do time B" oninput="counterValue('b','gen',this.value)"></div><button type="button" class="step minus" aria-label="Diminuir Gerador do time B" onclick="step('b','gen',-1)">−</button></div><div class="counter"><button type="button" class="step plus" aria-label="Aumentar Gancho do time B" onclick="step('b','hook',1)">+</button><div class="counter-readout"><label class="stat-icon" title="Gancho"><img src="assets/hook.png" alt="Gancho"></label><input id="bhook" type="number" min="0" max="12" aria-label="Gancho do time B" oninput="counterValue('b','hook',this.value)"></div><button type="button" class="step minus" aria-label="Diminuir Gancho do time B" onclick="step('b','hook',-1)">−</button></div><div class="counter"><button type="button" class="step plus" aria-label="Aumentar Primeiro gancho do time B" onclick="step('b','first',1)">+</button><div class="counter-readout"><label class="stat-icon" title="Primeiro gancho"><img src="assets/hook.png" alt="Primeiro gancho"><small>1<span class="ordinal">st</span></small></label><input id="bfirst" type="number" min="0" max="4" aria-label="Primeiro gancho do time B" oninput="counterValue('b','first',this.value)"></div><button type="button" class="step minus" aria-label="Diminuir Primeiro gancho do time B" onclick="step('b','first',-1)">−</button></div></div></section></div>
<div class="round-row"><label for="bestOf">Série</label><select id="bestOf" onchange="edit({bestOf:+this.value})"><option value="3">MD3</option><option value="5">MD5</option></select><span class="set-label">Set</span><div id="setButtons" class="set-buttons" role="group" aria-label="Set atual"></div></div>
<div class="reset-row"><button class="reset" type="button" title="Zera as vitórias dos dois times" onclick="resetScores()">Zerar placar</button><button class="reset" type="button" title="Zera apenas geradores e ganchos dos dois times" onclick="resetCounters()">Zerar contadores</button></div>
<div class="killer-row"><span>Time de Killer</span><div class="segmented"><label><input type="radio" name="killerSide" value="A" onchange="edit({killerSide:'A'})"><b>Time A</b></label><label><input type="radio" name="killerSide" value="B" onchange="edit({killerSide:'B'})"><b>Time B</b></label></div></div>
<div class="style-row"><label for="overlayStyle">Overlay</label><select id="overlayStyle" onchange="edit({overlayStyle:+this.value})"><optgroup label="Placar numérico"><option value="1">01 · Studio</option><option value="2">02 · Air</option><option value="3">03 · Frame</option><option value="4">04 · Ribbon</option></optgroup><optgroup label="Marcações de vitórias"><option value="5">05 · Shards — losangos</option><option value="6">06 · Rails — traços</option><option value="7">07 · Orbit — círculos</option><option value="8">08 · Split — chevrons</option></optgroup></select></div>
<div class="overlay-options"><label class="highlight-toggle"><span>Destaque dos times</span><input id="teamHighlights" type="checkbox" onchange="edit({teamHighlights:this.checked})"><span class="switch-track" aria-hidden="true"></span></label>
<label class="highlight-toggle"><span>Degradê na overlay</span><input id="overlayGradient" type="checkbox" onchange="edit({overlayGradient:this.checked})"><span class="switch-track" aria-hidden="true"></span></label>
</div><div class="colors" aria-label="Cores da overlay"><div class="color-control"><label for="teamAColor">Time A</label><div class="color-swatch"><input id="teamAColor" type="color" aria-label="Cor Time A" oninput="edit({teamAColor:this.value})"></div><button type="button" class="color-reset" aria-label="Resetar cor Time A" title="Restaurar cor padrão" onclick="resetColor('teamAColor')">Padrão</button></div><div class="color-control"><label for="teamBColor">Time B</label><div class="color-swatch"><input id="teamBColor" type="color" aria-label="Cor Time B" oninput="edit({teamBColor:this.value})"></div><button type="button" class="color-reset" aria-label="Resetar cor Time B" title="Restaurar cor padrão" onclick="resetColor('teamBColor')">Padrão</button></div><div class="color-control"><label for="bgColor">Fundo</label><div class="color-swatch"><input id="bgColor" type="color" aria-label="Cor Fundo" oninput="edit({bgColor:this.value})"></div><button type="button" class="color-reset" aria-label="Resetar cor Fundo" title="Restaurar cor padrão" onclick="resetColor('bgColor')">Padrão</button></div><div class="color-control"><label for="accentColor">Detalhes</label><div class="color-swatch"><input id="accentColor" type="color" aria-label="Cor Detalhes" oninput="edit({accentColor:this.value})"></div><button type="button" class="color-reset" aria-label="Resetar cor Detalhes" title="Restaurar cor padrão" onclick="resetColor('accentColor')">Padrão</button></div></div>
<label class="scale-row" for="hudScale"><span>Escala geral</span><input id="hudScale" type="range" min="50" max="100" step="1" oninput="edit({hudScale:scaleActual(this.value)})"><output id="scaleValue">75</output></label>
<label class="scale-row" for="bgOpacity"><span>Opacidade</span><input id="bgOpacity" type="range" min="0" max="100" step="1" oninput="edit({bgOpacity:+this.value})"><output id="opacityValue">85%</output></label>
<details class="obs"><summary>Endereços do OBS</summary><label>Fonte de Navegador · 1920 × 1080<div class="url-row"><input id="obsUrl" aria-label="URL da overlay" readonly value="http://127.0.0.1:8765/overlay.html"><button type="button" onclick="copyUrl('obsUrl',this)">Copiar</button></div></label><label>Dock de navegador<div class="url-row"><input id="panelUrl" aria-label="URL do painel" readonly value="http://127.0.0.1:8765/panel.html"><button type="button" onclick="copyUrl('panelUrl',this)">Copiar</button></div></label><small>Local ao computador. Mantenha o aplicativo aberto.</small></details>
<details class="position-control"><summary>Posição da overlay</summary><p>Arraste para cima ou para baixo. A overlay continua centralizada.</p><div class="position-caption"><span>↑ Mais perto do topo</span></div><div id="positionPad" class="position-pad" onpointerdown="startOverlayDrag(event)" onpointermove="moveOverlayDrag(event)" onpointerup="endOverlayDrag(event)" onpointercancel="endOverlayDrag(event)" onlostpointercapture="endOverlayDrag(event)"><button id="positionHandle" type="button" role="slider" aria-label="Posição vertical da overlay" aria-orientation="vertical" aria-valuemin="6" aria-valuemax="100" aria-valuenow="78" onkeydown="positionKey(event)">↕ Arraste a overlay</button></div><div class="position-footer"><span>↓ Um pouco mais abaixo</span><button type="button" onclick="edit({hudTop:78})">Posição original</button></div></details>
</main><dialog id="resetDialog" aria-labelledby="resetTitle"><h2 id="resetTitle"></h2><p id="resetDescription"></p><div class="dialog-actions"><button type="button" onclick="cancelReset()" autofocus>Cancelar</button><button class="confirm-reset" type="button" onclick="confirmReset()">Confirmar</button></div></dialog><script src="app.js"></script></body></html>
